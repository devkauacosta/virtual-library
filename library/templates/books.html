{% block content %}

<form method="GET" action="{% url 'books_list' %}">
    <input type="text" name="search" placeholder="Buscar livro...">
    <button type="submit">Buscar</button>
    <button href="{% url 'books_list' %}">Cancelar</button>
</form>

{% for book in books %}
<h2>{{ book.title }}</h2>
{% if book.photo_cover %}
<img src="{{ book.photo_cover.url }}" alt="{{ book.title }}" width="300px">
{% else %}
<p>Sem foto</p>
{% endif %}
<p>Autor: {{ book.autor }}</p>
<p>Genêro: {{ book.genre }}</p>
<p>Ano de publicação: {{ book.publication_year }}</p>
<p>Editora: {{ book.publisher }}</p>
{% endfor %}
{% endblock %}
